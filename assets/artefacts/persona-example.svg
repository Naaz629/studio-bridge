<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="1280" height="800" role="img" aria-label="Persona example">
<rect width="640" height="400" rx="14" fill="#ffffff"/>
<rect width="640" height="64" rx="14" fill="#e4eadf"/><rect y="40" width="640" height="24" fill="#e4eadf"/>
<text x="24" y="40" font-size="17" font-weight="700" fill="#263026" font-family="Georgia,serif">Persona example</text>
<text x="616" y="40" font-size="11" fill="#5a6657" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">IDEA9106 · Week 6</text>
<circle cx="82" cy="136" r="44" fill="#cdd8c5"/><text x="82" y="146" font-size="28" font-weight="700" fill="#314333" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">MC</text>
<text x="24" y="206" font-size="16" font-weight="700" fill="#263026" font-family="Segoe UI,Arial,sans-serif">Maya Chen</text>
<text x="24" y="226" font-size="12" fill="#73796e" font-family="Segoe UI,Arial,sans-serif">21 · Design student · Sydney</text>
<rect x="24" y="244" width="150" height="132" rx="10" fill="#f3f1ea"/>
<text x="36" y="266" font-size="10.5" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">IN THEIR WORDS</text>
<text x="36" y="288" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif">"I skip the long readings and</text><text x="36" y="305" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif">hope the slides are enough."</text><text x="36" y="322" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif"></text>
<rect x="200" y="84" width="204" height="138" rx="8" fill="#eef3e8" stroke="#d3d6c8" stroke-width="1"/><text x="212" y="104" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">GOALS</text><text x="214" y="126" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Pass the unit with a clear plan</text><text x="214" y="145" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Work well in her group</text><text x="214" y="164" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Understand the brief</text>
<rect x="420" y="84" width="204" height="138" rx="8" fill="#f7ebe6" stroke="#d3d6c8" stroke-width="1"/><text x="432" y="104" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">FRUSTRATIONS</text><text x="434" y="126" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Long readings in a second language</text><text x="434" y="145" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Unclear what is expected</text><text x="434" y="164" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Little time between classes</text>
<rect x="200" y="238" width="204" height="138" rx="8" fill="#f1eef6" stroke="#d3d6c8" stroke-width="1"/><text x="212" y="258" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">BEHAVIOURS</text><text x="214" y="280" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Reads slides before the tutorial</text><text x="214" y="299" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Asks questions in chat, not aloud</text><text x="214" y="318" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Studies on the train</text>
<rect x="420" y="238" width="204" height="138" rx="8" fill="#f6f0e1" stroke="#d3d6c8" stroke-width="1"/><text x="432" y="258" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">NEEDS</text><text x="434" y="280" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Short, plain-English summaries</text><text x="434" y="299" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Examples she can copy</text><text x="434" y="318" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• A quick way to check her work</text>
</svg>