<text x="616" y="40" font-size="11" fill="#5a6657" text-anchor="end" font-family="Segoe UI,Arial,sans-serif">IDEA9106 · Week 6</text>
<circle cx="82" cy="136" r="44" fill="#d7c8b7"/><text x="82" y="146" font-size="28" font-weight="700" fill="#314333" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif">YT</text>
<text x="24" y="206" font-size="16" font-weight="700" fill="#263026" font-family="Segoe UI,Arial,sans-serif">Yuki Tanaka</text>
<text x="24" y="226" font-size="12" fill="#73796e" font-family="Segoe UI,Arial,sans-serif">22 · Final-year · Tokyo</text>
<rect x="24" y="244" width="150" height="132" rx="10" fill="#f3f1ea"/>
<text x="36" y="266" font-size="10.5" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">IN THEIR WORDS</text>
<text x="36" y="288" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif">"I want my project to help</text><text x="36" y="305" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif">real people, not just look good."</text><text x="36" y="322" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif"></text>
<rect x="200" y="84" width="204" height="138" rx="8" fill="#eef3e8" stroke="#d3d6c8" stroke-width="1"/><text x="212" y="104" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">GOALS</text><text x="214" y="126" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• A strong portfolio piece</text><text x="214" y="145" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Test with real users</text><text x="214" y="164" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Graduate with confidence</text>
<rect x="420" y="84" width="204" height="138" rx="8" fill="#f7ebe6" stroke="#d3d6c8" stroke-width="1"/><text x="432" y="104" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">FRUSTRATIONS</text><text x="434" y="126" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Hard to find users to interview</text><text x="434" y="145" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Time spent on small details</text><text x="434" y="164" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Unsure how to show evidence</text>
<rect x="200" y="238" width="204" height="138" rx="8" fill="#f1eef6" stroke="#d3d6c8" stroke-width="1"/><text x="212" y="258" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">BEHAVIOURS</text><text x="214" y="280" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Interviews friends first</text><text x="214" y="299" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Sketches before screens</text><text x="214" y="318" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Asks for feedback often</text>
<rect x="420" y="238" width="204" height="138" rx="8" fill="#f6f0e1" stroke="#d3d6c8" stroke-width="1"/><text x="432" y="258" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">NEEDS</text><text x="434" y="280" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Ways to recruit users</text><text x="434" y="299" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Templates for evidence</text><text x="434" y="318" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Clear marking criteria</text>
</svg>