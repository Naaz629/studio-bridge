<text x="36" y="288" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif">"Group work goes better when</text><text x="36" y="305" font-size="12" font-style="italic" fill="#3b463a" font-family="Georgia,serif">we agree what we are solving."</text>
<rect x="200" y="84" width="204" height="138" rx="8" fill="#eef3e8" stroke="#d3d6c8" stroke-width="1"/><text x="212" y="104" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">GOALS</text><text x="214" y="126" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Keep the team on track</text><text x="214" y="145" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Learn from feedback</text><text x="214" y="164" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Balance work and study</text>
<rect x="420" y="84" width="204" height="138" rx="8" fill="#f7ebe6" stroke="#d3d6c8" stroke-width="1"/><text x="432" y="104" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">FRUSTRATIONS</text><text x="434" y="126" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Teammates with different ideas</text><text x="434" y="145" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Late changes to the brief</text><text x="434" y="164" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Long travel to campus</text>
<rect x="200" y="238" width="204" height="138" rx="8" fill="#f1eef6" stroke="#d3d6c8" stroke-width="1"/><text x="212" y="258" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">BEHAVIOURS</text><text x="214" y="280" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Makes a shared checklist</text><text x="214" y="299" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Messages the group daily</text><text x="214" y="318" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Studies late at night</text>
<rect x="420" y="238" width="204" height="138" rx="8" fill="#f6f0e1" stroke="#d3d6c8" stroke-width="1"/><text x="432" y="258" font-size="11" font-weight="700" fill="#344b35" font-family="Segoe UI,Arial,sans-serif" letter-spacing=".6">NEEDS</text><text x="434" y="280" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• A shared problem statement</text><text x="434" y="299" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Simple planning tools</text><text x="434" y="318" font-size="12" fill="#3b463a" font-family="Segoe UI,Arial,sans-serif">• Quick tutor check-ins</text>
