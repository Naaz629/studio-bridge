<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Bridge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <div class="win" id="win">
    <aside class="side" aria-label="Studio Bridge navigation">
      <div class="dots" id="dots"><button class="tl close" data-w="close" aria-label="Close"></button><button class="tl min" data-w="min" aria-label="Minimize"></button><button class="tl max" data-w="max" aria-label="Zoom"></button></div>
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><path d="M4 22c0-7 5-12 11-12s11 5 11 12" fill="none" stroke="var(--green-2)" stroke-width="4" stroke-linecap="round"/><path d="M4 22h5M21 22h5" stroke="var(--green-2)" stroke-width="4" stroke-linecap="round"/><circle cx="15" cy="6" r="2.4" fill="var(--green-2)"/></svg>
        <div><b>Studio</b><small>TUTOR</small></div>
      </div>
      <nav class="nav">
        <button data-v="live" aria-current="page"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg></span><span><b>Session <span class="livepill">LIVE</span></b><small id="navLiveSub"></small></span></button>
        <button data-v="ov"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span><span><b>Overview</b><small>Learning outcomes</small></span></button>
      </nav>
      <div class="spacer"></div>
      <div class="course" id="course"></div>
      <div class="user"><span class="av dk">PN</span><div><b>Dr. Priya Nair</b><small>Tutor · Online</small></div></div>
    </aside>
    <section class="main">
      <header class="top">
        <div class="crumb" id="crumb"></div>
        <div class="menu-wrap"><button class="icbtn" id="burger" aria-label="Menu"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button><div class="menu" id="mainMenu" hidden></div></div>
      </header>
      <div class="view" id="view"></div>
      <footer class="botbar" id="botbar"></footer>
    </section>
  </div>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="slideFile" accept="image/*,.pdf,.ppt,.pptx,.key" multiple hidden>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
