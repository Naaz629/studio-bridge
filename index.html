<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Bridge</title>
<link rel="icon" href="assets/icon-256.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stage">
  <div class="win" id="win">
    <aside class="rail" aria-label="Studio Bridge navigation">
      <div class="dots" id="dots"><button class="tl close" data-w="close" aria-label="Close"></button><button class="tl min" data-w="min" aria-label="Minimize"></button><button class="tl max" data-w="max" aria-label="Zoom"></button></div>
      <div class="brand" data-tip="Studio · Tutor"><img class="logo" src="assets/logo.png" width="40" height="40" alt="Studio"></div>
      <nav class="nav">
        <button id="navLive" data-v="live" data-tip="Session" aria-label="Session" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg><small id="navLiveSub" hidden></small></button>
        <button id="navOv" data-v="ov" data-tip="Overview" aria-label="Overview"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
      </nav>
      <div class="spacer"></div>
      <div class="course" id="course"></div>
      <div class="menu-wrap" data-tip="Menu"><button class="icbtn" id="burger" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button><div class="menu" id="mainMenu" hidden></div></div>
      <div class="user" data-tip="Dr. Priya Nair · Tutor"><span class="av dk">PN</span></div>
    </aside>
    <section class="main">
      <div class="view" id="view"></div>
      <footer class="botbar" id="botbar"></footer>
    </section>
  </div>
</div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="slideFile" accept="image/*,.pdf,.ppt,.pptx,.key" multiple hidden>
<script src="vendor/jszip.min.js"></script>
<script src="slides.js"></script>
<script src="data.js"></script>
<script src="bloom.js"></script>
<script src="app.js"></script>
</body>
</html>
